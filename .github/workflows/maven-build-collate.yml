name: Maven Collate Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "openmetadata-service/**"
      - "openmetadata-ui/**"
      - "!openmetadata-ui/src/main/resources/ui/playwright/doc-generator/**"
      - "!openmetadata-ui/src/main/resources/ui/playwright/docs/**"
      - "openmetadata-spec/src/main/resources/json/schema/**"
      - "openmetadata-dist/**"
      - "openmetadata-clients/**"
      - "openmetadata-sdk/**"
      - "openmetadata-integration-tests/**"
      - "openmetadata-mcp/**"
      - "common/**"
      - "pom.xml"
      - "yarn.lock"
      - "Makefile"
      - "bootstrap/**"
  pull_request_target:
    types: [opened, synchronize, labeled, ready_for_review]
    paths:
      - "openmetadata-service/**"
      - "openmetadata-spec/src/main/resources/json/schema/**"
      - "openmetadata-integration-tests/**"
      - "openmetadata-mcp/**"

permissions:
  contents: read
  checks: write

concurrency:
  group: maven-build-collate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  maven-collate-ci:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Wait for the labeler
        uses: lewagon/wait-on-check-action@v1.3.4
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: Team Label
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 90

      - name: Verify PR labels
        uses: jesusvasquez333/verify-pr-label-action@v1.4.0
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          valid-labels: 'safe to test'
          pull-request-number: '${{ github.event.pull_request.number }}'
          disable-reviews: true  # To not auto approve changes

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Collate tracks each OpenMetadata release line on an identically named
      # branch, so a PR must be validated against the Collate branch matching
      # its base branch. Building a 1.13 PR against Collate main fails on code
      # that only exists in the other line.
      - name: Resolve the Collate branch to build
        id: collate-branch
        env:
          GH_TOKEN: ${{ secrets.COLLATE_PAT }}
          BASE_BRANCH: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref || github.ref_name }}
        run: |
          set -euo pipefail
          COLLATE_REF="$BASE_BRANCH"
          # Only a 404 means the branch genuinely does not exist. Any other
          # outcome (expired PAT, rate limit, 5xx) must fail the job rather than
          # fall back, or a transient error would silently reintroduce the
          # mis-routing this step exists to prevent. curl retries the transient
          # cases first.
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-connrefused --retry-all-errors --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/open-metadata/openmetadata-collate/branches/$COLLATE_REF")
          case "$STATUS" in
            200)
              ;;
            404)
              echo "::warning::No openmetadata-collate branch '$COLLATE_REF'; falling back to main."
              COLLATE_REF=main
              ;;
            *)
              echo "::error::Could not check openmetadata-collate for branch '$COLLATE_REF' (HTTP $STATUS)."
              exit 1
              ;;
          esac
          echo "Building Collate on '$COLLATE_REF' for base branch '$BASE_BRANCH'."
          echo "ref=$COLLATE_REF" >> "$GITHUB_OUTPUT"

      - name: Trigger Collate build & wait
        uses: the-actions-org/workflow-dispatch@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event_name == 'push' && github.event.after || github.event.pull_request.head.sha }}
        with:
          workflow: OpenMetadata Collate Test
          ref: ${{ steps.collate-branch.outputs.ref }}
          repo: open-metadata/openmetadata-collate
          token: ${{ secrets.COLLATE_PAT }}
          wait-for-completion: true
          inputs: '{ "sha": "${{ env.SHA }}", "event": "${{ github.event_name }}" }'
